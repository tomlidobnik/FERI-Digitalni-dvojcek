# Mosquitto MQTT Broker Configuration

# Listener for MQTT protocol
listener 1883
protocol mqtt

# Listener for WebSocket protocol
listener 9001
protocol websockets

# Allow anonymous connections (for development)
# Set to false in production and use proper authentication
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
